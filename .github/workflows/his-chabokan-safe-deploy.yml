name: Bastiyan HIS - Safe Manual Chabokan Deploy

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Exact code-only HIS source version (read apps/his/src/version.json)"
        required: true
        type: string
      data_safety_confirmation:
        description: "Type exactly: BACKUP_AND_PERSISTENCE_VERIFIED"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bastiyan-his-production-deploy
  cancel-in-progress: false

jobs:
  deny-public-repository:
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    steps:
      - name: Deny deploying healthcare software from a public repository
        run: |
          echo "::error::HIS GitHub repository is public. Move to private, audit historic secrets and synchronize the correct production source before deploying."
          exit 1

  deploy:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chabokan-production
    env:
      CHABOKAN_SERVICE_NAME: ${{ vars.CHABOKAN_SERVICE_NAME }}
      CHABOKAN_API_TOKEN: ${{ secrets.CHABOKAN_API_TOKEN }}
      PERSISTENCE_VERIFIED: ${{ vars.HIS_PERSISTENCE_VERIFIED }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      SAFETY_CONFIRMATION: ${{ inputs.data_safety_confirmation }}
    steps:
      - name: Verify backup, storage and destination
        shell: bash
        run: |
          set -euo pipefail
          test "$SAFETY_CONFIRMATION" = "BACKUP_AND_PERSISTENCE_VERIFIED" || { echo "::error::Fresh recoverable off-site backup and persistent-storage confirmation required."; exit 1; }
          test "$PERSISTENCE_VERIFIED" = "true" || { echo "::error::Verify Chabokan persisted /app/api/data, /app/uploads and /app/api/config.local.php."; exit 1; }
          test "$CHABOKAN_SERVICE_NAME" = "his" || { echo "::error::CHABOKAN_SERVICE_NAME must be exactly his, to prevent cross-service deployment."; exit 1; }
          test -n "$CHABOKAN_API_TOKEN" || { echo "::error::CHABOKAN_API_TOKEN secret is missing."; exit 1; }
          test -n "$EXPECTED_VERSION" || { echo "::error::Expected version is required."; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source and refuse clinical/runtime/private files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          src = pathlib.Path("apps/his/src")
          assert src.is_dir(), "Missing HIS source"
          v = json.loads((src / "version.json").read_text(encoding="utf-8"))["version"]
          assert v == os.environ["EXPECTED_VERSION"], f"Source version {v} != requested {os.environ['EXPECTED_VERSION']}"
          assert (src / "api/config.local.example.php").is_file(), "Missing safe example config"
          for p in src.rglob("*"):
              assert not p.is_symlink(), f"Symlinks must not be deployed: {p}"
              if not p.is_file():
                  continue
              rel = p.relative_to(src).as_posix().lower()
              assert not (rel.startswith(("api/data/", "uploads/", "fonts/", "patients/", "backups/")) or
                  rel == "api/config.local.php" or
                  rel.startswith(".env") or
                  rel.endswith((".sqlite", ".sqlite3", ".db", ".pem", ".key", ".p12", ".pfx", ".ttf", ".woff", ".woff2"))), f"Unsafe tracked path: {rel}"
          print("Code-only source checked:", v)
          PY

      - name: Validate PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/his/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
          while IFS= read -r -d '' file; do
            node --experimental-default-type=module --check "$file" >/dev/null
          done < <(find apps/his/src -type f -name '*.js' -print0)
          echo "Source syntax checks passed."

      - name: Authenticate using official Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @chabokan.net/cli
          chabok login -t "$CHABOKAN_API_TOKEN"
          chabok service list > "$RUNNER_TEMP/chabokan-services.txt"
          echo "Chabokan authentication succeeded."

      - name: Manual code-only deployment (never runs on push)
        shell: bash
        run: |
          set -euo pipefail
          chabok deploy --path apps/his/src --service "$CHABOKAN_SERVICE_NAME"
          echo "Deploy requested; separately verify production health and preservation of patient data."
