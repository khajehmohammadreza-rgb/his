name: Chabokan API connection check (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chabokan-connection-check.yml'
      - 'tools/chabokan_bridge.py'
      - 'tools/tests/test_chabokan_bridge.py'
  pull_request:
    branches: [main]
    paths:
      - 'tools/chabokan_bridge.py'
      - 'tools/tests/test_chabokan_bridge.py'
      - '.github/workflows/chabokan-connection-check.yml'
  workflow_dispatch:
    inputs:
      service:
        description: "Existing Chabokan service to verify"
        required: true
        type: choice
        default: all
        options:
          - all
          - his
          - website
          - kiosk
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline tests
        run: python3 -m unittest discover -s tools/tests -p 'test_chabokan_bridge.py' -v
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test authenticated read-only API
        env:
          CHABOKAN_API_TOKEN: ${{ secrets.CHABOKAN_API_TOKEN }}
          TARGET_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.service || 'all' }}
        run: |
          set -euo pipefail
          if [ -z "$CHABOKAN_API_TOKEN" ]; then
            echo "::error::Add CHABOKAN_API_TOKEN to GitHub Actions Secrets. Do not paste it into code."
            exit 1
          fi
          python3 tools/chabokan_bridge.py --service "$TARGET_SERVICE" --quiet
