name: Bastiyan one-time monorepo source materialization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bastiyan-monorepo-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'khajehmohammadreza-rgb/his'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate and materialize archived catalog sources
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          archive=pathlib.Path('apps/catalog/source/v2.2-production-sources.zip')
          assert archive.is_file() and archive.stat().st_size>10000
          target=pathlib.Path('apps/catalog/src')
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert len(names)>=18 and len(names)<1000, "Unexpected source archive"
              for info in z.infolist():
                  name=pathlib.PurePosixPath(info.filename)
                  if info.is_dir(): continue
                  if info.filename.startswith('/') or '..' in name.parts:
                      raise RuntimeError('Untrusted archive path '+info.filename)
                  if info.file_size>10000000:
                      raise RuntimeError('Oversized archive entry '+info.filename)
                  destination=target.joinpath(*name.parts)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(z.read(info))
          print('Catalog source files:',len(list(target.rglob('*'))))
          print('Source SHA256:',hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Commit source files into same repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/catalog/src
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(catalog): track editable Android and Windows sources in monorepo'
            git push origin HEAD:main
          fi
      - name: Delete now-merged catalog build branch
        run: |
          git fetch origin main catalog-build-v22
          git merge-base --is-ancestor origin/catalog-build-v22 origin/main
          git cat-file -e origin/main:apps/catalog/source/v2.2-production-sources.zip
          git cat-file -e origin/main:apps/catalog/installers/catalog-server-installer.iss
          git cat-file -e origin/main:apps/catalog/installers/catalog-client-installer.iss
          git cat-file -e origin/main:apps/catalog/src/android-app/app/src/main/AndroidManifest.xml
          git push origin --delete catalog-build-v22
