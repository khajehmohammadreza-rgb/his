name: Bastiyan Catalog v2.4 Connection Recovery CI
on:
  push:
    branches: [main, 'fix/catalog-stale-trust-automatic-v24']
    paths:
      - 'apps/catalog/**'
      - '.github/workflows/catalog-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build genuine Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage versioned editable catalog source
        run: cp -a apps/catalog/src catalog
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android build
        working-directory: catalog/android-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK and manifest
        run: |
          test -s catalog/android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging catalog/android-app/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Bastiyan-Catalog-v2.2-ANDROID-INSTALLABLE-APK
          path: catalog/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    name: Build genuine Windows EXEs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage versioned editable catalog source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path catalog -Force | Out-Null
          Copy-Item -Path 'apps/catalog/src/*' -Destination 'catalog' -Recurse -Force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install app builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller cryptography
      - name: Run real local TLS and stale trust regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s catalog/app/tests -p test_autoconnection.py -v
      - name: Fix frozen executable paths
        shell: pwsh
        run: |
          $file = 'catalog/app/windows/supervisor.py'
          $text = Get-Content -Raw -Encoding UTF8 $file
          $text = $text.Replace('HERE=Path(__file__).resolve().parent.parent', "HERE=Path(sys._MEIPASS) if getattr(sys,'frozen',False) else Path(__file__).resolve().parent.parent")
          $text = $text.Replace("from connection_agent import start", "from connection_agent import start`nif sys.stdout is not None and hasattr(sys.stdout, 'reconfigure'): sys.stdout.reconfigure(encoding='utf-8', errors='replace')`nif sys.stderr is not None and hasattr(sys.stderr, 'reconfigure'): sys.stderr.reconfigure(encoding='utf-8', errors='replace')")
          [System.IO.File]::WriteAllText((Resolve-Path $file), $text, [System.Text.UTF8Encoding]::new($false))
      - name: Build server
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name Bastiyan-Catalog-Server --icon catalog/app/bastiyan.ico
          --paths catalog/app --paths catalog/app/windows
          --add-data "catalog/app/web;web"
          --hidden-import generate_tls --collect-all cryptography
          catalog/app/windows/supervisor.py
      - name: Smoke test genuine server EXE
        shell: pwsh
        run: |
          & dist/Bastiyan-Catalog-Server.exe --bastiyan-self-check
          if ($LASTEXITCODE -ne 0) { throw "Windows server self-check failed" }
      - name: Build client
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Bastiyan-Catalog-Client --icon catalog/app/bastiyan.ico
          catalog/app/windows/connection_agent.py
      - name: Verify native executables
        shell: pwsh
        run: |
          if (!(Test-Path dist/Bastiyan-Catalog-Server.exe) -or !(Test-Path dist/Bastiyan-Catalog-Client.exe)) { throw 'Windows EXE missing' }
          Get-Item dist/*.exe | Select-Object Name,Length
      - name: Real Windows runtime smoke - server, client, and API
        shell: pwsh
        run: |
          @'
          import os,sys,json,ssl,subprocess,time,urllib.request,urllib.error,pathlib,tempfile,socket
          root=pathlib.Path(tempfile.mkdtemp(prefix='bastiyan-runtime-'))
          env=dict(os.environ,LOCALAPPDATA=str(root))
          server=subprocess.Popen([str(pathlib.Path('dist/Bastiyan-Catalog-Server.exe').resolve()),'--bastiyan-server'],
                                  env=env,stdout=(root/'server-stdout.txt').open('wb'),stderr=subprocess.STDOUT)
          client=None
          try:
              ctx=ssl._create_unverified_context()
              ok=False
              for i in range(90):
                  if server.poll() is not None:
                      break
                  try:
                      with urllib.request.urlopen('https://127.0.0.1:8765/api/status',context=ctx,timeout=1) as rsp:
                          o=json.load(rsp)
                          if o.get('ok') and o.get('database')=='ready':ok=True;break
                  except Exception:
                      time.sleep(.5)
              if not ok:
                  print("SERVER EXIT:",server.poll(),"LOG:",(root/'server-stdout.txt').read_text(errors='replace')[-6000:],flush=True)
                  raise AssertionError("Actual built server EXE failed to start and respond via TLS")
              print("Actual SERVER EXE ready (HTTPS+database)",flush=True)
              client=subprocess.Popen([str(pathlib.Path('dist/Bastiyan-Catalog-Client.exe').resolve()),'--no-browser'],
                                      env=env)
              connected=False
              for i in range(35):
                  if client.poll() is not None:break
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8775/__agent/status',timeout=1) as rsp:
                          o=json.load(rsp)
                          if o.get('connected'): connected=True;break
                  except Exception:time.sleep(.5)
              if not connected:
                  state={}
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8775/__agent/status',timeout=1) as rsp:state=json.load(rsp)
                  except Exception as exc:state={'error':str(exc)}
                  print('CLIENT:',state,flush=True)
                  raise AssertionError("Actual built client EXE failed to connect to actual built server EXE")
              with urllib.request.urlopen('http://127.0.0.1:8775/api/status',timeout=3) as rsp:
                  assert json.load(rsp)['ok']
              print("Actual CLIENT EXE and HTTP bridge ready; full end-to-end pass",flush=True)
          finally:
              # PyInstaller onefile on Windows spawns a bootloader child; terminate the entire
              # process tree so the first test cannot leave a stale server on port 8765.
              for p in (client,server):
                  if p:
                      subprocess.run(['taskkill','/F','/T','/PID',str(p.pid)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      try:p.wait(timeout=5)
                      except subprocess.TimeoutExpired:p.kill();p.wait(timeout=5)
              for port in (8765,8775):
                  import socket
                  for attempt in range(24):
                      sock=socket.socket()
                      try:
                          sock.settimeout(.2)
                          busy=sock.connect_ex(('127.0.0.1',port))==0
                      finally:sock.close()
                      if not busy:break
                      time.sleep(.25)
                  else:raise AssertionError(f'Port {port} was not released after closing the built EXE tree')
          '@ | python -
      - name: Real click-on-server launcher + duplicate client smoke
        shell: pwsh
        run: |
          @'
          import os,subprocess,urllib.request,json,ssl,time,pathlib,tempfile
          data=pathlib.Path(tempfile.mkdtemp(prefix='bastiyan-launcher-'))
          env=dict(os.environ,LOCALAPPDATA=str(data),PYTHONIOENCODING='utf-8')
          serverexe=str(pathlib.Path('dist/Bastiyan-Catalog-Server.exe').resolve())
          clientexe=str(pathlib.Path('dist/Bastiyan-Catalog-Client.exe').resolve())
          p=subprocess.Popen([serverexe,'--no-browser'],env=env,stdout=(data/'launcher.log').open('wb'),stderr=subprocess.STDOUT)
          ctx=ssl._create_unverified_context()
          try:
              ok=False
              for i in range(75):
                  if p.poll() is not None:break
                  try:
                      with urllib.request.urlopen('https://127.0.0.1:8765/api/status',timeout=1,context=ctx) as rsp:
                          healthy=json.load(rsp).get('database')=='ready'
                      with urllib.request.urlopen('http://127.0.0.1:8775/__agent/status',timeout=1) as rsp:
                          bridge=json.load(rsp)
                      if healthy and bridge.get('connected'):ok=True;break
                  except Exception: time.sleep(.5)
              if not ok:
                  print('Launcher exit:',p.poll(),'Launcher log:',(data/'launcher.log').read_text(encoding='utf-8',errors='replace')[-4000:],flush=True)
                  raise AssertionError('Real server desktop launcher did not start HTTPS and its embedded client')
              print('Real server launcher ready: HTTPS + database + loopback client',flush=True)
              q=subprocess.Popen([clientexe,'--no-browser'],env=env)
              try:q.wait(timeout=18)
              except subprocess.TimeoutExpired:
                  q.kill();q.wait()
                  raise AssertionError('Second client did not reuse existing loopback bridge')
              if q.returncode!=0:raise AssertionError('Second client exited with '+str(q.returncode))
              # A second EXE must not disturb the already-running bridge or main API.
              stable=False
              errors=[]
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8775/api/status',timeout=4) as rsp:
                          stable=bool(json.load(rsp).get('ok'))
                      if stable:break
                  except Exception as exc:
                      errors.append(type(exc).__name__+': '+str(exc))
                      time.sleep(.75)
              if not stable:
                  print('Parent exit:',p.poll(),flush=True)
                  print('Recent bridge errors:',errors,flush=True)
                  print('Parent log:',(data/'launcher.log').read_text(encoding='utf-8',errors='replace')[-5000:],flush=True)
                  raise AssertionError('Real HTTPS bridge did not stay responsive after second client launch')
              print('Duplicate-click client gracefully reused existing session',flush=True)
          finally:
              subprocess.run(['taskkill','/F','/T','/PID',str(p.pid)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              try:p.wait(timeout=6)
              except subprocess.TimeoutExpired:p.kill()
          '@ | python -
      - name: Compile actual Windows installers

        shell: pwsh
        run: |
          Copy-Item 'apps/catalog/installers/catalog-server-installer.iss' 'catalog-server-installer.iss' -Force
          Copy-Item 'apps/catalog/installers/catalog-client-installer.iss' 'catalog-client-installer.iss' -Force
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler unavailable' }
          & $compiler 'catalog-server-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Server setup compile failed' }
          & $compiler 'catalog-client-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Client setup compile failed' }
          if (!(Test-Path 'dist/Bastiyan-Catalog-Server-Setup-v2.3.exe')) { throw 'Server installer missing' }
          if (!(Test-Path 'dist/Bastiyan-Catalog-Client-Setup-v2.3.exe')) { throw 'Client installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Bastiyan-Catalog-v2.3-WINDOWS-INSTALLERS
          path: dist/*.exe
          if-no-files-found: error