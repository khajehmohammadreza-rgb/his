name: Bastiyan Catalog v2.2 Native Windows and Android
on:
  push:
    branches: [catalog-build-v22]
  workflow_dispatch:
jobs:
  android:
    name: Build genuine Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -q -o catalog-build-src.zip -d catalog
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fix ambiguous Android CookieManager import
        run: |
          sed -i 's/CookieManager.getInstance()/android.webkit.CookieManager.getInstance()/g' catalog/android-app/app/src/main/java/ir/bastiyan/catalog/MainActivity.java
      - name: Android build
        working-directory: catalog/android-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK and manifest
        run: |
          test -s catalog/android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging catalog/android-app/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Bastiyan-Catalog-v2.2-ANDROID-INSTALLABLE-APK
          path: catalog/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    name: Build genuine Windows EXEs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: pwsh
        run: Expand-Archive -Path catalog-build-src.zip -DestinationPath catalog -Force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install app builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller cryptography
      - name: Fix frozen executable paths
        shell: pwsh
        run: |
          $file = 'catalog/app/windows/supervisor.py'
          $text = Get-Content -Raw -Encoding UTF8 $file
          $text = $text.Replace('HERE=Path(__file__).resolve().parent.parent', "HERE=Path(sys._MEIPASS) if getattr(sys,'frozen',False) else Path(__file__).resolve().parent.parent")
          [System.IO.File]::WriteAllText((Resolve-Path $file), $text, [System.Text.UTF8Encoding]::new($false))
      - name: Build server
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name Bastiyan-Catalog-Server --icon catalog/app/bastiyan.ico
          --paths catalog/app --paths catalog/app/windows
          --add-data "catalog/app/web;web"
          --hidden-import generate_tls --collect-all cryptography
          catalog/app/windows/supervisor.py
      - name: Smoke test genuine server EXE
        shell: pwsh
        run: |
          & dist/Bastiyan-Catalog-Server.exe --bastiyan-self-check
          if ($LASTEXITCODE -ne 0) { throw "Windows server self-check failed" }
      - name: Build client
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Bastiyan-Catalog-Client --icon catalog/app/bastiyan.ico
          catalog/app/windows/connection_agent.py
      - name: Verify native executables
        shell: pwsh
        run: |
          if (!(Test-Path dist/Bastiyan-Catalog-Server.exe) -or !(Test-Path dist/Bastiyan-Catalog-Client.exe)) { throw 'Windows EXE missing' }
          Get-Item dist/*.exe | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Bastiyan-Catalog-v2.2-WINDOWS-NATIVE-EXE
          path: dist/*.exe
          if-no-files-found: error