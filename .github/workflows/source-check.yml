name: Bastiyan HIS R25 and legacy Kiosk source checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/his/src/**'
      - 'apps/kiosk/src/**'
      - '.github/workflows/source-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/his/src/**'
      - 'apps/kiosk/src/**'
      - '.github/workflows/source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3,pdo_sqlite
      - name: Check PHP syntax of versioned source
        shell: bash
        run: |
          set -euo pipefail
          find apps/his/src apps/kiosk/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Existing R25 offline regression
        run: php apps/his/src/tests/r25-ai-offline.php
  js-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript source syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/his/src apps/kiosk/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --experimental-default-type=module --check "$file"
          done
