<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>پاک‌سازی نسخه قدیمی Bastiyan HIS</title>
<style>body{margin:0;background:#020617;color:#e2e8f0;font-family:Tahoma,Arial;min-height:100vh;display:grid;place-items:center}.box{max-width:620px;margin:20px;padding:28px;background:#0f172a;border:1px solid #0d9488;border-radius:20px;text-align:center}button{border:0;border-radius:12px;padding:13px 22px;background:#0d9488;color:#fff;font-weight:bold;cursor:pointer}</style>
</head>
<body>
<div class="box"><h2>در حال پاک‌سازی نسخه قدیمی...</h2><p id="s">لطفاً چند ثانیه صبر کنید.</p></div>
<script>
(async function(){
  const s=document.getElementById('s');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.clear()}catch(e){}
    try{sessionStorage.clear()}catch(e){}
    s.textContent='پاک‌سازی انجام شد؛ در حال ورود به نسخه ۴.۵.۵...';
    setTimeout(()=>location.replace('./index.html?clean455='+Date.now()),300);
  }catch(e){
    s.textContent='پاک‌سازی خودکار انجام نشد. صفحه را در حالت Private/Incognito باز کنید و دوباره تلاش کنید.';
  }
})();
</script>
</body></html>
