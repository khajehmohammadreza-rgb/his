    <!-- Canonical route + role guard. Route is inferred from pathname, not internal rewrite query strings. -->
    <script>
    window.BastiyanClientLoginTarget=function(){
      try{
        var raw=localStorage.getItem('bc_installed_client_url')||sessionStorage.getItem('bc_installed_client_url')||'';
        if(!raw)return '/';
        var u=new URL(raw,location.origin);
        if(u.origin===location.origin && u.pathname==='/client.php' && u.searchParams.get('center') && u.searchParams.get('role') && u.searchParams.get('sig'))return u.href;
      }catch(e){}
      return '/';
    };
    window.BastiyanReturnToClientLogin=function(){location.replace(window.BastiyanClientLoginTarget());};
    (function(){
      var path=(location.pathname||'/').replace(/\/$/,'')||'/';
      var role=localStorage.getItem('bc_role')||'';
      var routes={tv:'tv',doctor:'doctor',secretary:'secretary',admin:'admin','center-settings':'center-settings',update:'update'};
      var tab=routes[path.slice(1)]||'';
      if(!tab){return;}
      var token=tab==='tv'
        ?(sessionStorage.getItem('bc_display_token')||localStorage.getItem('bc_display_token')||localStorage.getItem('bc_token'))
        :localStorage.getItem('bc_token');
      if(!token){location.replace(window.BastiyanClientLoginTarget());return;}
      if(role==='doctor' && !['doctor','tv'].includes(tab)){location.replace('/doctor');return;}
      if(role==='secretary' && !['secretary','doctor','tv'].includes(tab)){location.replace('/secretary');return;}
      if(role==='display' && tab!=='tv'){location.replace('/tv');return;}
      if(role==='super_admin' && !['admin','center-settings','doctor','secretary','tv','update'].includes(tab)){location.replace('/admin');return;}
      var _fetch=window.fetch;
      window.fetch=function(input,opts){
        opts=opts||{};
        var target='';
        try{target=typeof input==='string'?input:(input&&input.url)||'';}catch(e){}
        var u=null;
        try{u=new URL(target||'',location.href);}catch(e){}
        var isOwnApi=!!(u&&u.origin===location.origin&&(u.pathname.indexOf('/api/')===0||u.pathname==='/api.php'));
        if(isOwnApi){
          var h=new Headers((opts&&opts.headers)||(input&&input.headers)||{});
          h.set('Authorization','Bearer '+token);
          opts=Object.assign({},opts,{headers:h});
        }
        return _fetch(input,opts);
      };
      history.replaceState({role:role,tab:tab},'',path);
      if(role!=='super_admin'&&role!=='display'){fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}).then(function(r){return r.json()}).then(function(m){var pp=(m.user&&m.user.panelPermissions)||{};var panel=tab==='center-settings'?'settings':tab;if(pp[panel]===false){location.replace(role==='doctor'?'/doctor':'/secretary')}}).catch(function(){})}
      window.addEventListener('popstate',function(){
        var r=localStorage.getItem('bc_role')||'';
        if(r==='display'){history.replaceState({lockedRole:'display',tab:'tv'},'','/tv');return;}
        var allowed=r==='doctor'?['doctor','tv']:r==='secretary'?['secretary','doctor','tv']:r==='super_admin'?['admin','doctor','secretary','tv','update']:[];
        if(!allowed.includes((location.pathname||'').replace(/^\//,'')))history.replaceState({role:r,tab:tab},'',path);
      });
      window.addEventListener('storage',function(e){if(e.key==='bc_token'&&!e.newValue&&role!=='display')location.replace(window.BastiyanClientLoginTarget());});
    })();
    </script>
