<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فراخوان — هلدینگ باستیان</title><link rel="icon" type="image/png" href="/image/favicon.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d14;color:#eef2f7;font-family:"BNazanin"}.box{width:min(460px,94vw);background:#151923;border:1px solid #2b3140;border-radius:20px;padding:28px;box-shadow:0 25px 70px #0009}.logo{text-align:center}.logo img{width:68px;height:68px;object-fit:contain}.logo h1{font-size:19px;margin:12px 0 4px}.muted{color:#8e99aa;font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0e1118;padding:5px;border-radius:10px;margin:24px 0 18px}.tab{border:0;background:transparent;color:#8e99aa;padding:9px;border-radius:7px;font-weight:800}.tab.active{background:#252b3a;color:#fff}.panel{display:none}.panel.active{display:block}.field{margin:0 0 13px}.field label{display:block;color:#aeb7c6;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #303747;border-radius:9px;background:#0e1118;color:#fff;outline:0;font-family:"BNazanin"}.field input:focus{border-color:#6366f1}.btn{width:100%;border:0;border-radius:10px;padding:11px;color:#fff;font-weight:900;background:#4f46e5;cursor:pointer}.green{background:#047857}.err{display:none;margin-top:12px;padding:10px;border-radius:9px;background:#451a1a;border:1px solid #991b1b;color:#fecaca;font-size:12px}.hint{margin-top:12px;color:#7f8a9c;font-size:11px;line-height:1.8;text-align:center}.security{margin-top:20px;padding:10px;border:1px solid #252c3a;border-radius:9px;background:#10141d;color:#8994a5;font-size:11px;line-height:1.8}</style><script>if(location.pathname==="/auth-gate.html"){location.replace("/");}</script><link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts.css?v=3.3.5">

<link rel="stylesheet" href="/assets/readability-3.3.19.css?v=3.3.19">
</head><body><div class="box"><div class="logo"><img src="/image/LOGO-BU.png"><h1>فراخوان</h1><div class="muted">ورود یکپارچه و نقش‌محور</div></div><div class="tabs"><button class="tab active" id="t-staff" onclick="tab('staff')">ورود پزشک / منشی / سوپرادمین</button><button class="tab" id="t-display" onclick="tab('display')">نمایشگر</button></div><div class="panel active" id="p-staff"><form onsubmit="login(event)"><div class="field"><label>نام کاربری</label><input id="u" autocomplete="username" required></div><div class="field"><label>رمز عبور</label><input id="p" type="password" autocomplete="current-password" required></div><button class="btn">ورود امن</button></form><div class="err" id="e1"></div></div><div class="panel" id="p-display"><form onsubmit="displayLogin(event)"><div class="field"><label>نام کاربری مرکز</label><input id="du" autocomplete="username" placeholder="مثلاً ahram" required></div><div class="field"><label>رمز عبور مرکز</label><input id="dp" type="password" required></div><button class="btn green">ورود به نمایشگر</button></form><div class="err" id="e2"></div><div class="hint">نام کاربری و رمز مرکز، همان مشخصات ورود نمایشگر همان مرکز است.</div></div><div class="security">🔒 دسترسی‌ها در سمت سرور کنترل می‌شوند؛ مخفی‌کردن منو به‌تنهایی معیار امنیت نیست. پزشک فقط اطلاعات و صف خودش را دریافت می‌کند و منشی فقط در محدوده مرکز خودش فعالیت می‌کند.</div></div><script>const q=new URLSearchParams(location.search);function tab(x){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));document.getElementById('t-'+x).classList.add('active');document.getElementById('p-'+x).classList.add('active')}if(q.get('next')==='display')tab('display');function err(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block'}async function login(e){e.preventDefault();document.getElementById('e1').style.display='none';const ac=typeof AbortController==='function'?new AbortController():null,tm=ac?setTimeout(()=>ac.abort(),10000):null;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},signal:ac?ac.signal:void 0,body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'ورود ناموفق');localStorage.setItem('bc_token',d.token);localStorage.setItem('bc_role',d.role);localStorage.setItem('bc_doctorId',d.doctorId||'');localStorage.setItem('bc_centerId',d.centerId||'');localStorage.setItem('bc_displayName',d.displayName||'');location.replace(d.role==='super_admin'?'/admin':d.role==='doctor'?'/doctor':'/secretary')}catch(x){err('e1',x.name==='AbortError'?'پاسخ سرور بیش از حد طول کشید.':x.message)}finally{if(tm)clearTimeout(tm)}}async function displayLogin(e){e.preventDefault();document.getElementById('e2').style.display='none';const ac=typeof AbortController==='function'?new AbortController():null,tm=ac?setTimeout(()=>ac.abort(),10000):null;try{const r=await fetch('/api/auth/display-login',{method:'POST',headers:{'Content-Type':'application/json'},signal:ac?ac.signal:void 0,body:JSON.stringify({username:document.getElementById('du').value.trim(),password:document.getElementById('dp').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'ورود نمایشگر ناموفق');sessionStorage.setItem('bc_display_token',d.token);localStorage.setItem('bc_display_token',d.token);localStorage.setItem('bc_role','display');localStorage.setItem('bc_centerId',d.centerId);location.replace('/tv')}catch(x){err('e2',x.name==='AbortError'?'پاسخ سرور بیش از حد طول کشید.':x.message)}finally{if(tm)clearTimeout(tm)}}</script><script src="/assets/core-v3.2.js?v=3.3.5" defer></script></body></html>
