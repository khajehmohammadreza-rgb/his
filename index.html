<title>سامانه جامع پزشکی باستیان</title>

<script>
(async function(){
  try {
    const CURRENT_VER = '5.0.1';
    const lastVer = localStorage.getItem('bastiyan_client_version');
    if (lastVer !== CURRENT_VER) {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      localStorage.setItem('bastiyan_client_version', CURRENT_VER);
      sessionStorage.clear();
    }
  } catch(e) {}
  const s = document.createElement('script');
  s.src = './portal-457-final.js?v=501-professional';
  s.defer = true;
  document.head.appendChild(s);
})();
</script>
</head><body></body></html>
